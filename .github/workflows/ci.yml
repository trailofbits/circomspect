name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Rust 1.99.0 quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - name: Install dependency checker
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Check dependency advisories, licenses, bans, and sources
        run: cargo deny --workspace --all-features --locked check --deny warnings
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked

  msrv:
    name: Rust 1.74 compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.74
        run: rustup toolchain install 1.74.0 --profile minimal
      - name: Build and test at MSRV
        run: cargo +1.74.0 test --workspace --locked

  compiler-conformance:
    name: Circom 2.2.3 grammar corpus
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.99.0
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Build pinned Circom compiler
        run: bash tests/conformance/prepare_compiler.sh "$RUNNER_TEMP/circom-oracle"
      - name: Compare grammar corpus
        run: |
          CIRCOM_COMPILER="$RUNNER_TEMP/circom-oracle/circom-v2.2.3/target/release/circom" \
            cargo test -p circomspect --test conformance -- --ignored
      - name: Check warning fixture validity
        run: |
          CIRCOM_COMPILER="$RUNNER_TEMP/circom-oracle/circom-v2.2.3/target/release/circom" \
            cargo test -p circomspect --test warning_corpus -- --ignored
