[package]
name = "circomspect-program-analysis"
version = "0.8.2"
edition = "2021"
rust-version = "1.74"
license = "LGPL-3.0-only"
authors = ["Trail of Bits"]
description = "Support crate for the Circomspect static analyzer"
repository = "https://github.com/trailofbits/circomspect"

[dependencies]
abstract_interpretation = { package = "circomspect-abstract-interpretation", version = "0.1.0", path = "../abstract_interpretation" }
# rpds otherwise selects archery 1.2.3, whose 2024 edition exceeds Rust 1.74.
archery = "=1.2.0"
# Newer rpds releases require Rust 1.85; this version supports the workspace MSRV.
rpds = "=1.0.1"
num-bigint-dig = "0.8"
num-traits = "0.2"
thiserror = "1.0"
parser = { package = "circomspect-parser", version = "2.2.0", path = "../parser" }
program_structure = { package = "circomspect-program-structure", version = "2.1.4", path = "../program_structure" }

[dev-dependencies]
criterion = { version = "=0.5.1", default-features = false, features = ["cargo_bench_support"] }
# Criterion's serializer otherwise selects half 2.5+, which exceeds Rust 1.74.
half = "=2.4.1"
libc = "=0.2.191"
serde_json = "=1.0.151"

[[bench]]
name = "analysis"
harness = false

[[bench]]
name = "memory"
harness = false

[lints]
workspace = true
